[package]
name = "proxmox-notify"
version = "0.1.1"
edition = "2021"
description = "pmxcfs-backed node-to-node state announcements for Proxmox"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive"] }
fs2 = "0.4"
hostname = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

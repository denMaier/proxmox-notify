name: Package

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debian-package:
    name: Build Debian package
    runs-on: ubuntu-latest
    container:
      image: rust:1-bookworm

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends make python3 dpkg-dev

      - name: Configure Rust path
        run: echo /usr/local/cargo/bin >>"${GITHUB_PATH}"

      - name: Install Rust components
        run: rustup component add clippy rustfmt

      - name: Run checks
        run: make ci

      - name: Set package version
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" =~ ^v?[0-9] ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="0.1.0+${GITHUB_SHA::7}"
          fi
          arch="$(dpkg --print-architecture)"
          echo "VERSION=${version}" >>"${GITHUB_ENV}"
          echo "PACKAGE_PATH=build/proxmox-notify_${version}_${arch}.deb" >>"${GITHUB_ENV}"

      - name: Build package
        run: make package

      - name: Inspect package
        run: |
          set -euo pipefail
          test -f "${PACKAGE_PATH}"
          dpkg-deb --info "${PACKAGE_PATH}"
          dpkg-deb --contents "${PACKAGE_PATH}"

      - name: Test installed package
        run: |
          set -euo pipefail
          dpkg --ignore-depends=systemd -i "${PACKAGE_PATH}"
          PROXMOX_NOTIFY_BIN=/usr/local/bin/proxmox-notify tests/installed-e2e.sh

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: proxmox-notify-deb
          path: ${{ env.PACKAGE_PATH }}
          if-no-files-found: error

  publish-release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs:
      - debian-package
    if: github.ref_type == 'tag'
    permissions:
      contents: write

    steps:
      - name: Download package artifact
        uses: actions/download-artifact@v4
        with:
          name: proxmox-notify-deb
          path: dist

      - name: Publish release asset
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mapfile -t packages < <(find dist -type f -name '*.deb' -print | sort)
          if [[ "${#packages[@]}" -ne 1 ]]; then
            printf 'expected exactly one .deb artifact, found %s\n' "${#packages[@]}" >&2
            exit 1
          fi

          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" "${packages[0]}" --clobber
          else
            gh release create "${TAG}" "${packages[0]}" \
              --title "${TAG}" \
              --notes "Debian package for proxmox-notify ${TAG}."
          fi

  nix:
    name: Check Nix flake
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Check flake
        run: nix flake check

      - name: Build Nix package
        run: nix build --no-link --print-out-paths

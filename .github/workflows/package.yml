name: Package

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debian-package:
    name: Build Debian package
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends make python3 dpkg-dev

      - name: Run checks
        run: make ci

      - name: Set package version
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" =~ ^v?[0-9] ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="0.1.0+${GITHUB_SHA::7}"
          fi
          echo "VERSION=${version}" >>"${GITHUB_ENV}"
          echo "PACKAGE_PATH=build/proxmox-notify_${version}_all.deb" >>"${GITHUB_ENV}"

      - name: Build package
        run: make package

      - name: Inspect package
        run: |
          set -euo pipefail
          test -f "${PACKAGE_PATH}"
          dpkg-deb --info "${PACKAGE_PATH}"
          dpkg-deb --contents "${PACKAGE_PATH}"

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: proxmox-notify-deb
          path: ${{ env.PACKAGE_PATH }}
          if-no-files-found: error

  nix:
    name: Check Nix flake
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Check flake
        run: nix flake check

      - name: Build Nix package
        run: nix build --no-link --print-out-paths

      - name: Build Debian package with Nix
        run: nix build --no-link --print-out-paths .#deb

name: Release

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  linux-binary:
    name: Build Linux binary
    runs-on: ubuntu-latest
    container:
      image: rust:1-bookworm

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends make python3

      - name: Configure Rust path
        run: echo /usr/local/cargo/bin >>"${GITHUB_PATH}"

      - name: Install Rust components
        run: rustup component add clippy rustfmt

      - name: Run checks
        run: make ci

      - name: Set artifact version
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" =~ ^v?[0-9] ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="0.1.0+${GITHUB_SHA::7}"
          fi
          arch="$(uname -m)"
          echo "VERSION=${version}" >>"${GITHUB_ENV}"
          echo "PACKAGE_ARCH=${arch}" >>"${GITHUB_ENV}"
          echo "PACKAGE_OS=linux" >>"${GITHUB_ENV}"
          echo "PACKAGE_PATH=build/proxmox-notify_${version}_${arch}-linux" >>"${GITHUB_ENV}"

      - name: Build binary artifact
        run: make package

      - name: Test binary artifact
        run: |
          set -euo pipefail
          test -x "${PACKAGE_PATH}"
          "${PACKAGE_PATH}" --help >/dev/null
          root="$(mktemp -d)"
          "${PACKAGE_PATH}" install --destdir "${root}" --no-systemctl
          PROXMOX_NOTIFY_BIN="${root}/usr/local/bin/proxmox-notify" tests/installed-e2e.sh

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: proxmox-notify-linux-binary
          path: ${{ env.PACKAGE_PATH }}
          if-no-files-found: error

  publish-release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs:
      - linux-binary
    if: github.ref_type == 'tag'
    permissions:
      contents: write

    steps:
      - name: Download binary artifact
        uses: actions/download-artifact@v4
        with:
          name: proxmox-notify-linux-binary
          path: dist

      - name: Publish release asset
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mapfile -t assets < <(find dist -type f -name 'proxmox-notify_*' -print | sort)
          if [[ "${#assets[@]}" -ne 1 ]]; then
            printf 'expected exactly one binary artifact, found %s\n' "${#assets[@]}" >&2
            exit 1
          fi

          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${TAG}" "${assets[0]}" --repo "${GITHUB_REPOSITORY}" --clobber
          else
            gh release create "${TAG}" "${assets[0]}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "${TAG}" \
              --notes "Linux binary for proxmox-notify ${TAG}. Make the downloaded asset executable, then run it as root with: ./<asset> install --enable-now"
          fi

  nix:
    name: Check Nix flake
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Check flake
        run: nix flake check

      - name: Build Nix package
        run: nix build --no-link --print-out-paths
